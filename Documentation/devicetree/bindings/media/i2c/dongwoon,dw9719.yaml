%YAML 1.2
---
$id: http://devicetree.org/schemas/media/i2c/dongwoon,dw9719.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Dongwoon Anatech DW9719 Voice Coil Motor (VCM) Controller

maintainers:
  - André Apitzsch <git@apitzsch.eu>

description:
  The Dongwoon DW9718S/9719/9761/9800K are single 10-bit digital-to-analog
  converters with 100 mA output current sink capability, designed for linear
  control of voice coil motors (VCM) in camera lenses. These chips provide a
  Smart Actuator Control (SAC) mode intended for driving voice coil lenses
  in camera modules. The DW9714V is a DW9714 successor which additionally
  provides a register-mapped ("advanced") mode with the DW9719 register
  layout and SAC2/SAC3/SAC4 ringing control, entered by an I2C command
  sequence.

properties:
  compatible:
    enum:
      - dongwoon,dw9714v
      - dongwoon,dw9718s
      - dongwoon,dw9719
      - dongwoon,dw9761
      - dongwoon,dw9800k

  reg:
    maxItems: 1

  vdd-supply:
    description: VDD power supply

  dongwoon,sac-mode:
    description: |
      Slew Rate Control mode to use: direct, LSC (Linear Slope Control) or
      SAC1-SAC6 (Smart Actuator Control).
    $ref: /schemas/types.yaml#/definitions/uint32
    enum:
      - 0   # Direct mode
      - 1   # LSC mode
      - 2   # SAC1 mode (operation time# 0.32 x Tvib)
      - 3   # SAC2 mode (operation time# 0.48 x Tvib)
      - 4   # SAC3 mode (operation time# 0.72 x Tvib)
      - 5   # SAC4 mode (operation time# 1.20 x Tvib)
      - 6   # SAC5 mode (operation time# 1.64 x Tvib)
      - 7   # SAC6 mode (operation time# 1.88 x Tvib)
    default: 4

  dongwoon,vcm-prescale:
    description:
      Indication of VCM switching frequency dividing rate select.
    $ref: /schemas/types.yaml#/definitions/uint32

  dongwoon,sac-ring-enable:
    description:
      Enable the ringing control block (SAC_CFG RING_EN). When absent, the
      DAC is driven directly (DW9714-compatible behavior) and
      dongwoon,sac-mode has no effect.
    type: boolean

required:
  - compatible
  - reg
  - vdd-supply

allOf:
  - if:
      properties:
        compatible:
          contains:
            const: dongwoon,dw9718s
    then:
      properties:
        dongwoon,vcm-prescale:
          description:
            The final frequency is 10 MHz divided by (value + 2).
          maximum: 15
          default: 0

  - if:
      properties:
        compatible:
          contains:
            const: dongwoon,dw9714v
    then:
      properties:
        dongwoon,sac-mode:
          description:
            SAC2, SAC3 or SAC4 ringing control mode.
          enum: [3, 4, 5]
        dongwoon,vcm-prescale:
          description:
            Value of the VCM_FREQ register. Bits 7:6 select the ringing
            control period divider (2, 1, 1/2, 1/4), bits 5:0 the period,
            which has to match the mechanical vibration period (tVIB) of
            the actuator and lens assembly of the camera module.
          maximum: 255
          default: 0x60
    else:
      properties:
        dongwoon,sac-ring-enable: false

additionalProperties: false

examples:
  - |
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        actuator@c {
            compatible = "dongwoon,dw9718s";
            reg = <0x0c>;

            vdd-supply = <&pm8937_l17>;

            dongwoon,sac-mode = <4>;
            dongwoon,vcm-prescale = <0>;
        };
    };

  - |
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        actuator@c {
            compatible = "dongwoon,dw9714v";
            reg = <0x0c>;

            vdd-supply = <&vreg_l16b_2p8>;

            dongwoon,sac-ring-enable;
            dongwoon,sac-mode = <3>;
            dongwoon,vcm-prescale = <0x79>;
        };
    };
