%YAML 1.2
---
$id: http://devicetree.org/schemas/power/supply/oplus,wls-tx-mt5806.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Oplus pencil wireless charging transmitter (MT5806)

maintainers:
  - Yibo Wang <wyibo6109@gmail.com>

description:
  The MT5806 wireless power transmitter charges the stylus docked on the
  magnetic strip of Oplus tablets and relays the pencil's identity packets.
  Its input rail is a PMIC boost whose voltage is raised while a pencil is
  attached.

allOf:
  - $ref: power-supply.yaml#

properties:
  compatible:
    const: oplus,wls-tx-mt5806

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  hboost-supply:
    description: Transmitter input rail with programmable voltage.

  power-gpios:
    maxItems: 1
    description: Switch feeding the transmitter from the HBOOST rail.

  wakeup-gpios:
    maxItems: 1
    description: Held active while the transmitter firmware boots.

  scan-gpios:
    maxItems: 1
    description:
      Active selects the fast pencil scan interval used while the system is
      awake; inactive the slow interval.

  charge-off-gpios:
    maxItems: 1
    description: Active blocks power transfer to the pencil.

  oplus,hboost-idle-microvolt:
    minimum: 2000000
    maximum: 14750000
    multipleOf: 50000
    default: 5800000
    description: HBOOST voltage while no pencil is attached.

  oplus,hboost-charge-microvolt:
    minimum: 2000000
    maximum: 14750000
    multipleOf: 50000
    description:
      HBOOST voltage while a pencil is attached. Defaults to the idle
      voltage.

  oplus,recharge-soc-percent:
    maximum: 100
    default: 90
    description:
      Pencil state of charge, reported by userspace, at or below which a
      full pencil is charged again.

  oplus,charge-timeout-sec:
    minimum: 1
    default: 7200
    description: Longest charging session before power transfer stops.

required:
  - compatible
  - reg
  - interrupts
  - hboost-supply
  - power-gpios
  - wakeup-gpios
  - scan-gpios
  - charge-off-gpios

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        charger@2b {
            compatible = "oplus,wls-tx-mt5806";
            reg = <0x2b>;
            interrupts-extended = <&tlmm 169 IRQ_TYPE_EDGE_FALLING>;
            hboost-supply = <&pencil_hboost>;
            power-gpios = <&pmic_gpios 8 GPIO_ACTIVE_HIGH>;
            wakeup-gpios = <&pmic_gpios 2 GPIO_ACTIVE_HIGH>;
            scan-gpios = <&pmic_gpios 7 GPIO_ACTIVE_HIGH>;
            charge-off-gpios = <&pmic_gpios 11 GPIO_ACTIVE_HIGH>;
            oplus,hboost-idle-microvolt = <7000000>;
            oplus,hboost-charge-microvolt = <10000000>;
            oplus,recharge-soc-percent = <80>;
        };
    };
